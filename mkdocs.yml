site_name: Honeypot IDS System
site_description: >-
  Knowledge base for the Honeypot IDS System — a WordPress/WooCommerce shop
  behind an OpenResty reverse proxy that scores every request and transparently
  diverts suspicious sessions into isolated, high-interaction honeypot pools.
site_author: Ondrej Špánik
docs_dir: docs

# No public URL is assumed; this builds as a static site you can `mkdocs serve`
# locally or host anywhere. Links are relative so it works from any subpath.
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/app_icon.svg
  favicon: assets/app_icon.svg
  icon:
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light / dark toggle. System preference is the default.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# Point these at your fork/clone if you host the repo somewhere.
# repo_url: https://example.com/honeypot-ids
# repo_name: honeypot-ids
# edit_uri: edit/main/docs/

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: material/school
      link: https://www.fiit.stuba.sk/
      name: FIIT STU — Faculty of Informatics and Information Technologies

nav:
