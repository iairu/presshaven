      - Compose Services & Networks: architecture/services.md
  - Honeypot Engine:
      - engine/index.md
      - WordPress / WooCommerce Layer: engine/wordpress.md
      - Honeypot Layers: engine/layers.md
      - Pool Scaling & Assignment: engine/pooling.md
      - Seeding the Storefront: engine/seeding.md
      - Backups: engine/backups.md
      - State — Redis & ngx.shared: engine/state.md
  - Detection:
      - detection/index.md
      - Detection Capabilities: detection/capabilities.md
      - Seeded CVEs: detection/cves.md
