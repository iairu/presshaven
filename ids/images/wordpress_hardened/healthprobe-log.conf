# Keep the edge's own probes out of the access log. Worker 0 of the reverse
# proxy sends HEAD /robots.txt every 15 s (health_check.lua) and
# GET /wp-admin/install.php every 30 s (wp_install_state.lua), both with this
# user agent, so a healthy backend's log was mostly probe lines.
#
# All three conditions must hold, so a client can't hide a real request by
# copying the user agent: mod_remoteip has already replaced the address with
# X-Forwarded-For, which the edge sets for every proxied client, so only a
# request the edge itself originated still has a private source address.
# Failed probes are still reported by the edge ([HEALTH] lines in its log).
SetEnvIfExpr "%{HTTP_USER_AGENT} == 'honeypot-internal-healthprobe' \
    && %{REQUEST_URI} in {'/robots.txt', '/wp-admin/install.php'} \
    && (-R '10.0.0.0/8' || -R '172.16.0.0/12' || -R '192.168.0.0/16')" healthprobe
