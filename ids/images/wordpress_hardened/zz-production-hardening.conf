# Production-only web server hardening.
#
# The honeypot pools run this same image, and some of their bait needs exactly
# what this file forbids (a CVE that uploads a PHP file and then requests it),
# so everything here sits behind -D PRODUCTION_HARDENING, which only
# production_eshop's command passes (docker-compose.yml). WordPress-level
# hardening lives in wp-content/mu-plugins/production-hardening.php.

# Same on both sides, so it gives nothing away: no Apache/Debian version on
# error pages (the edge already rewrites the Server header).
ServerTokens Prod
ServerSignature Off

<IfDefine PRODUCTION_HARDENING>
    <Directory /var/www/html>
        Options -Indexes
    </Directory>

    # Dotfiles and dot-directories (.htaccess, .git, .env, .user.ini), except
    # the ACME / well-known namespace.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    # Config copies, logs, dumps, editor leftovers, and files that only
    # announce the WordPress version. wp-config.php itself is included by
    # PHP, never requested.
    <FilesMatch "(?i)(^wp-config.*\.php$|^(readme|license)\.(html|txt)$|^debug\.log$|\.(log|sql|sql\.gz|bak|old|orig|save|swp|dist|sh|ini|phar)$|~$)">
        Require all denied
    </FilesMatch>

    # Uploads are data. A PHP file there is a dropped web shell, whatever got
    # it there (a vulnerable form, a compromised admin).
    <Directory /var/www/html/wp-content/uploads>
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        <FilesMatch "(?i)\.(php\d?|phtml|pht|phps)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Library code under wp-includes/ is only ever included. The one file
    # meant to be requested directly is the TinyMCE loader.
    <LocationMatch "^/wp-includes/(?!js/tinymce/wp-tinymce\.php$).*\.php$">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/wp-admin/includes/">
        Require all denied
    </LocationMatch>
</IfDefine>
