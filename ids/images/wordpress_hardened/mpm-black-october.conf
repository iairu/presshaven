# CVE-2026-109619 was a use-after-free across requests: state one request
# left in a worker was used by the next request on that worker. PHP 8.4.27
# fixes it; this stays because it closes the whole class (any future
# cross-request bug in PHP or a plugin) for the cost of a fork. The edge
# keeps keepalive connections to Apache and sends any client's request down
# any of them, so with the stock config (KeepAlive On, MaxConnectionsPerChild
# 0) one attacker request and the next customer's request routinely share a
# worker.
#
# One request per child closes that: KeepAlive off makes each connection
# one request, and MaxConnectionsPerChild 1 retires the child after it.
# Every request starts in a fresh fork of the parent, which never runs a
# request itself. Opcache lives in shared memory, so compiled scripts are not
# lost; the cost is a fork per request (well under a millisecond against a
# WordPress page's ~100 ms).
KeepAlive Off

<IfModule mpm_prefork_module>
    MaxConnectionsPerChild 1
    # Children are short-lived now; keep more of them warm so a burst of
    # requests doesn't wait on forks.
    StartServers          10
    MinSpareServers       10
    MaxSpareServers       20
</IfModule>
