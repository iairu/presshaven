# PHP2Shell interim mitigations (PHP 8.1 under mod_php).
#
# php_admin_* rather than php.ini so they apply to the web SAPI only, and so
# neither .htaccess (php_value) nor a plugin's ini_set() can change them back.
<IfModule mod_php.c>
    # CVE-2026-109618: the bug needs PHP to hit memory_limit WHILE it parses
    # the request body. With no limit, parsing can't bail out half-way; the
    # container's cgroup mem_limit (1024m in compose) is the real ceiling, and
    # crossing it gets the child OOM-killed -- a failed request, not a
    # corrupted heap. Never cap memory with RLIMIT_AS/RLIMIT_DATA instead:
    # that makes malloc fail mid-parse, which is the same bail-out again.
    # WordPress leaves -1 alone (wp_raise_memory_limit only ever raises).
    php_admin_value memory_limit -1

    # CVE-2026-109619: the session upload-progress path. WordPress and
    # WooCommerce don't use PHP sessions at all.
    php_admin_flag session.upload_progress.enabled off

    # Keep what the parser builds small. PHP's default nesting is 64; the
    # deepest field this shop's forms send is 3 levels (product variations).
    # max_input_vars stays at its default 1000: product edit screens need it.
    php_admin_value max_input_nesting_level 16
    php_admin_value max_file_uploads 20

    # A successful exploit should not get a shell. Pools need this as much
    # as production: they also sit on production_network.
    php_admin_value disable_functions exec,system,passthru,shell_exec,proc_open,popen,pcntl_exec
</IfModule>

# PHP already discards bodies over post_max_size (8M); stop them at Apache too.
LimitRequestBody 16777216
